name: Build PAPERLAND Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build arm64 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ env.ANDROID_HOME }}
      ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      ANDROID_SDK_HOME: ${{ env.ANDROID_HOME }}
      NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.95 and Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358'

      - name: Export Android SDK and NDK paths
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install ZIP utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install cargo-quad-apk
        run: cargo +1.95.0 install --git https://github.com/hoklims/cargo-quad-apk cargo-quad-apk --locked --force

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.95.0 --version
          cargo quad-apk --help
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$NDK_HOME"
          test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Build APK
        run: cargo quad-apk build --release --target aarch64-linux-android

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find target/android-artifacts/release/apk -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::No APK was generated"
            find target -maxdepth 6 -type f -print | sort
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|application-label:|sdkVersion:|targetSdkVersion:)"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: paperland-android-arm64-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
