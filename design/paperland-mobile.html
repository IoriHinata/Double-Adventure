<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PAPERLAND mobile UI prototype</title>
<style>
:root{--paper:#d7c39d;--ink:#282219;--muted:#66563e;--green:#3d4934;--blue:#526b78;--rust:#8e3d27;--line:#756144}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Courier New",monospace}
body{background-image:repeating-linear-gradient(0deg,transparent 0 5px,#806b4b12 6px),radial-gradient(#6c573322 .6px,transparent .8px);background-size:auto,9px 9px}
.game{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:10px;max-width:1100px;margin:auto}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.card{border:1px solid var(--line);background:#e4d2aeeb;padding:8px 10px;box-shadow:2px 2px 0 #57452d22}
.stats{min-width:210px;font-size:12px;line-height:1.55}.compass{text-align:center;min-width:65px;font-weight:bold;font-size:12px}
.map{position:relative;overflow:hidden;border:1px solid #8a7655;background:#d8c49eaa;min-height:0}
.world{position:absolute;inset:-10%;display:grid;grid-template-columns:repeat(28,1fr);grid-auto-rows:1fr;transform:scale(1);transform-origin:center;transition:transform .12s}
.cell{display:grid;place-items:center;font-size:clamp(12px,2.4vw,24px);font-weight:bold;color:var(--green);text-shadow:0 1px #e8d8b6}
.water{color:var(--blue)}.path{color:#8a704b}.rock{color:#40392d}.building{color:var(--rust)}.crop{color:#58613b}
.player{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(22px,4vw,36px);font-weight:bold;color:var(--rust);background:#e8d6b5aa;padding:0 4px}
.zoom{position:absolute;right:8px;top:8px;display:flex;gap:4px}.zoom button{min-width:34px;min-height:32px}
.bottom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.actions{display:flex;flex-wrap:wrap;gap:6px;align-content:end}
button{font:bold 12px "Courier New";color:var(--ink);background:#e5d2ad;border:1px solid var(--line);min-height:36px;min-width:46px;padding:7px 10px;touch-action:manipulation}
button:active{background:#c5ad83;transform:translateY(1px)}.dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,34px);gap:3px}.dpad button{min-width:0;min-height:0;padding:0}.up{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}
.hint{font-size:10px;color:var(--muted);padding:5px 2px}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:85%;white-space:nowrap}
@media(min-width:700px){.game{padding:18px}.stats{font-size:15px}.actions button{min-width:70px}.dpad{grid-template-columns:48px 48px 48px;grid-template-rows:40px 40px 40px}}
@media(max-height:500px){.game{padding:6px;gap:4px}.stats{font-size:10px;padding:4px 7px}.bottom{gap:4px}.hint{display:none}.dpad{grid-template-columns:34px 34px 34px;grid-template-rows:28px 28px 28px}}
</style></head><body><main class="game">
<header class="top"><section class="card stats"><b>DAY 03 | 08:42 — THE PAPER WILDS</b><br>HP [########..]<br><span id="bag">BACKPACK: 0</span> · <span id="coords">X: 127 Y: 84</span></section><section class="card compass">N<br>W + E<br>S</section></header>
<section class="map" aria-label="World map"><div class="world" id="world"></div><div class="player">@</div><div class="zoom"><button id="out">−</button><button id="in">+</button></div><div class="card toast" id="toast">A quiet morning in the Paper Wilds.</div></section>
<footer class="bottom"><section><nav class="actions"><button>BAG</button><button>MAP</button><button>LOG</button><button id="interact">INTERACT</button></nav><div class="hint">Tap and hold to walk · + / − to zoom · E to interact</div></section><section class="dpad"><button class="up" data-dir="0,-1">▲</button><button class="left" data-dir="-1,0">◀</button><button class="right" data-dir="1,0">▶</button><button class="down" data-dir="0,1">▼</button></section></footer>
</main><script>
const symbols=["♣","Y","♠","T",",","·","v","o","~","=","H","A"],world=document.querySelector("#world");
for(let i=0;i<28*18;i++){let n=(i*73+i*i*17+31)%997,el=document.createElement("span");el.className="cell";let v=n%100;if(v<43)el.textContent=symbols[n%4];else if(v<60){el.textContent=symbols[4+n%4];el.classList.add("path")}else if(v<73){el.textContent=symbols[8+n%2];el.classList.add("water")}else if(v<86){el.textContent="v";el.classList.add("crop")}else if(v<94){el.textContent="o";el.classList.add("rock")}else{el.textContent=symbols[n%2?10:11];el.classList.add("building")}world.append(el)}
let zoom=1,x=127,y=84;function update(){world.style.transform="scale("+zoom+")";document.querySelector("#coords").textContent="X: "+x+" Y: "+y}
document.querySelector("#in").onclick=()=>{zoom=Math.min(2.4,zoom+.12);update()};document.querySelector("#out").onclick=()=>{zoom=Math.max(.55,zoom-.12);update()};
document.querySelectorAll("[data-dir]").forEach(b=>{let timer;const move=()=>{let[dx,dy]=b.dataset.dir.split(",").map(Number);x+=dx;y+=dy;update()};b.addEventListener("pointerdown",e=>{e.preventDefault();move();timer=setInterval(move,180)});["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>clearInterval(timer)))});
document.querySelector("#interact").onclick=()=>document.querySelector("#toast").textContent="You search the nearby paper-wilds.";
</script></body></html>
